{% load static %}<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:0;background:#f6f7f3;font-family:Arial,Helvetica,sans-serif;color:#23281f">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f7f3;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #dde2d8">
        <tr>
          <td style="background:#23281f;padding:22px 28px">
            <span style="color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:-0.5px">{{ site.short_name }}</span>
            <span style="display:block;color:#8fd3ab;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:4px">{{ site.tagline }}</span>
          </td>
        </tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.65">
          {% block content %}{% endblock %}
        </td></tr>
        <tr>
          <td style="background:#f6f7f3;border-top:1px solid #dde2d8;padding:18px 28px;font-size:12px;color:#737a6e;line-height:1.6">
            {{ site.company_name }} · {{ site.address }}<br>
            {{ site.phone_display }} · {{ site.email_info }}<br>
            {{ site.hours }}
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
